# Car scout — ranks used battery-electric cars by total cost per km.
# All money in today's ISK. Edit freely; every run reads this file.

usage:
  km_per_year: 20000
  # Longest ownership the model will consider. The best selling year is chosen per car.
  max_hold_years: 12

money:
  # What the cash tied up in the car would otherwise earn (real, after inflation).
  # Depreciation is estimated in today's prices, so this should be a real rate too.
  opportunity_rate: 0.07
  # Selling at the end: share of market value lost (private sale ~5%, trade-in at a dealer ~12%)
  sell_spread: 0.05
  # How much of a listing's price gap to the market (cheap = worn, dear = well specced) is still there
  # at resale. 1 = all of it (no credit for "deals"), 0 = resells at the plain market value.
  price_gap_persists: 0.8

energy:
  # Home charging price incl. distribution, transmission and VAT. CHECK against the parents' bill.
  home_kr_per_kwh: 22
  # Public fast charging (ON, Orka náttúrunnar / Ísorka / Tesla). CHECK current prices.
  public_kr_per_kwh: 60
  # Share of kWh charged at home (home charger available)
  home_share: 0.9
  # Icelandic year-round consumption vs. the mild-climate figures in scout/models.py
  winter_factor: 1.2
  # Charging losses (wall → battery)
  charging_loss: 0.10

running:
  # kílómetragjald 2026, all cars ≤ 3.5 t (skatturinn.is)
  km_fee_kr: 6.95
  # Insurance: ábyrgðartrygging part + kaskó as a share of the car's value. CHECK with a quote.
  insurance_fixed_kr: 90000
  insurance_kasko_share: 0.012
  # Bifreiðagjald + skoðun, per year. CHECK.
  tax_and_inspection_kr: 25000
  # Tyres: two sets (summer/winter), EVs wear them fast
  tyres_kr_per_km: 2.0
  # Service and repairs: base per year, plus a yearly increase once the car is older than this
  maintenance_base_kr: 40000
  maintenance_warranty_years: 5
  maintenance_growth_kr_per_year: 20000

battery:
  # Battery warranty on most EVs: 8 years / 160.000 km. Inside it, battery cost = 0.
  warranty_years: 8
  warranty_km: 160000
  # Outside warranty: chance per year of a battery repair/replacement, and its cost
  failure_rate_per_year: 0.02
  failure_rate_growth_per_year: 0.01
  repair_cost_kr: 2500000
  # Brands with no used-market history in Iceland: battery risk and depreciation are guesses,
  # so both are scaled up by this factor. Models with too little data get the same treatment.
  young_brands: [hongqi, leapmotor, xpeng, zeekr, byd, maxus, nio, lynk, smart, ora, aiways, jac, dongfeng, voyah, seres]
  uncertainty_factor: 1.3

market:
  # A model needs at least this many listings spanning this many model years for its own price level
  min_listings_per_model: 3
  # Ridge shrinkage of model price levels toward the brand/overall level
  ridge: 2.0

filters:
  # Drop vans and commercial vehicles (not relevant for a family car). Set to false to include them.
  exclude_vans: true
  # Only these model years are ranked. Older EVs still feed the market fit, so newer cars
  # can be projected to 8-10 years old.
  min_year: 2022
  min_price_isk: 300000
  max_price_isk: 30000000

new_cars:
  # Rafbílastyrkur (Umhverfis- og orkustofnun) from 1 Jan 2026: 500.000 kr for a new BEV passenger car
  # costing under 10M kr. Applied here when the dealer's card doesn't already show a price "með styrk".
  grant_kr: 500000
  grant_max_price_kr: 10000000
  # Minimum value lost the moment a new car is registered (on top of normal yearly depreciation).
  # Used when the used market can't tell us (model has too few used listings).
  registration_drop: 0.10

# New cars you can't scrape (Tesla sells direct; BL/Askja/Toyota have no stock pages here).
# Price = list price incl. VSK as shown on the maker's site, BEFORE the rafbílastyrkur (it's deducted
# automatically when under 10M kr). Entries with price: null are skipped until filled in.
manual_new:
  - title: Tesla Model Y Standard
    price: null
    url: "https://www.tesla.com/is_is/modely/design"
  - title: Tesla Model Y Premium RWD
    price: null
    url: "https://www.tesla.com/is_is/modely/design"
  - title: Tesla Model 3 Standard
    price: null
    url: "https://www.tesla.com/is_is/model3/design"
  - title: Tesla Model 3 Premium RWD
    price: null
    url: "https://www.tesla.com/is_is/model3/design"

sources:
  dealers:
    - name: Hekla (new)
      url: "https://www.hekla.is/is/bilar/nyir-bilar-syningasalur?page={page}"
      link: "/nyir-bilar-syningasalur/[^?/]+$"
      new: true
      max_pages: 12
    - name: Brimborg (new)
      url: "https://nyirbilar.brimborg.is/is/nyir-bilar?fueltype=2&page={page}"
      link: "/nyir-bilar/bill/[^/?]+$"
      new: true
      max_pages: 12
    - name: Brimborg (used)
      url: "https://notadir.brimborg.is/is/notadir-bilar?fueltype=2&page={page}"
      link: "/notadir-bilar/bill/[^/?]+$"
      new: false
      max_pages: 12
  bland:
    category: "https://bland.is/solutorg/farartaeki/nyir-notadir-bilar-til-solu/?categoryId=17&sub=1"
    max_pages: 60
